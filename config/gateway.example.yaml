# config/gateway.example.yaml
#
# Gateway runtime config, loaded by gateway/config.py:load_gateway().
# All values are placeholders. Copy to config/gateway.yaml and edit.
#
# Scope: the gateway observes and counts activity on hardware the operator owns. It never
# sends a command to an appliance.

# Identity this gateway signs as. Must match the device_id registered with the backend.
meter_id: "REPLACE_ME-gateway-0001"

# Backend endpoint that accepts signed usage reports. Required, must be http(s).
# Use HTTPS in any real deployment: the report body is signed, not encrypted, so plain
# HTTP leaks your usage figures to anyone on the path.
report_endpoint: "https://REPLACE_ME.example.invalid/v1/reports"

# Seconds between report attempts. Minimum 10. The counter is the source of truth and the
# report is derived from it, so a longer interval costs freshness, never counts.
report_interval_sec: 300

# Retry backoff for a failed post. A failure must never drop or double-count an event.
retry_base_sec: 5
retry_max_sec: 600
retry_max_attempts: 8

# SQLite file holding the monotonic counters and the append-only event log.
db_path: "/var/lib/ble-meter/meter.sqlite3"

# Ed25519 private key PEM generated by tools/keygen.py.
# MUST live outside the repo. Never commit this file, never paste a real key here.
private_key_path: "/etc/ble-meter/gateway.key"

# Event mapping file, see config/events.example.yaml.
events_file: "/etc/ble-meter/events.yaml"

# --- capture settings -------------------------------------------------------

# observe: passive sniffing of the link between the vendor app and your appliance.
#          Lowest impact, but an encrypted link can defeat it.
# proxy:   the gateway relays between the app and your own appliance, which is the
#          fallback when the link is encrypted. An observation path only; it still never
#          originates a command of its own. See docs/hardware-setup.md.
mode: observe

# BlueZ adapter on a Pi.
adapter: "hci0"

# Peripheral to watch. Placeholder address; substitute your own device's.
target_address: "AA:BB:CC:DD:EE:FF"

# Seconds of silence before logging a gap. Not a reconnect trigger in observe mode.
idle_warn_sec: 900

log_level: "INFO"

# Payload bytes recorded for an unmatched write. Keep this small; do not store whole
# payloads by default.
unknown_payload_bytes: 4
